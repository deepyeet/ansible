---
- name: Media Stealer
  hosts: monolith
  roles:
    - role: pi_base
    - role: ntd.nut
    - role: user_friendly
    - role: users
    - role: dotfiles
    - role: physical_disks
    - role: backup_target
    - role: samba
    - role: torrenter
    - role: docker_rootless
      tags: [docker_rootless]
    - role: artis3n.tailscale.machine
      tags: [tailscale]


- name: WSL Dev Environment
  hosts: wsl
  roles:
  - role: wsl_integration
  - role: user_friendly
  - role: users
  - role: dotfiles
  - role: artis3n.tailscale.machine
    tags: [tailscale]

# Manage source files; activation remains a separate, explicit playbook.
- name: Manage the photo backup installation
  ansible.builtin.import_playbook: playbooks/photo-backup.yml
  tags: [photo_backup]

- name: Manage Tailscale on Pixel 1
  ansible.builtin.import_playbook: playbooks/pixel-tailscale.yml
  tags: [pixel_tailscale, tailscale]

# Manage source files and the Python environment only; the sorter is
# run manually on the container and is never scheduled from here.
- name: Manage the album sorter installation
  ansible.builtin.import_playbook: playbooks/album-sorter.yml
  tags: [album_sorter]

