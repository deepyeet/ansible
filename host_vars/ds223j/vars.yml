# NAS account that owns and runs the pixel ingest manager: the DSM task runs
# as this user, and the script, its state files and its SSH key live in this
# user's home directory.
photo_manager_user: muse
photo_ingest:
  base_dir: /volume1/pixel
  ssh_key_path: /volume1/homes/{{ photo_manager_user }}/keys/id_ed25519
  # B31: rsync-daemon-pinned file-channel key (public half lives on the phone
  # as a forced-command authorized_keys entry; see pixel_backup_gang files).
  file_key_path: /volume1/homes/{{ photo_manager_user }}/keys/id_ed25519_pixel_rsync
  ingest_age: 4
  ingest_min_date: '2020-01-01'
  rsync_timeout: 60
  cleanup_interval: 28800
  state_dir: /volume1/homes/{{ photo_manager_user }}
# Manually configured DSM prerequisites, inspected by the Synology play tasks.
synology_photo_backup:
  owner: '{{ photo_manager_user }}'
  group: users
  volume:
    path: /volume1
    source: /dev/vg1/volume_1
    fstype: btrfs
  schedule:
    managed_by: dsm_ui
    task_id: 13
    name: Pixel Upload
    interval_minutes: 5

# Expected effective UID for the management SSH login, separate from file ownership.
photo_management_identity:
  uid: 1026
