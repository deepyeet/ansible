photo_receiver:
  protocol: rsync_drop_v1
  root: /sdcard/the_binding
  ssh_user: root
  ssh_port: 22
  completion: local_absence_after_cleanup
  cleanup_argv:
  - sh
  - '{{ pbg_config.helpers_dir }}/reset_and_free.sh'

# rsync_drop_v1 requires same-filesystem promotion, staging excluded from Photos
# scanning, and cleanup that deletes only backed-up files. These are required
# assumptions of the algorithm; configuration assertions cannot establish them.
# Evidence records what has actually been observed, independently of source match.
photo_receiver_evidence:
  same_filesystem_promotion: observed
  staging_excluded_from_scanning: unverified
  cleanup_removes_only_backed_up_files: unverified

# Direct input to pixel_backup_gang; shared storage paths are defined here once.
pbg_config:
  drive_mount: /mnt/my_drive
  bind_path: /mnt/runtime/write/emulated/0/the_binding
  helpers_dir: /data/local/tmp/pixel-backup-gang

# Direct input to pixel_google_photos_runtime.
pixel_runtime_config:
  scripts_dir: '{{ pbg_config.helpers_dir }}'
  drive_mount: '{{ pbg_config.drive_mount }}'
  log_path: /data/local/tmp/farm_startup.log
  drive_uuid: 396b0587-83b3-e74b-b5a0-cecc479aa9c6
  lookup_retries: 20
  lookup_sleep: 5
  # USB autosuspend/drive heartbeat loop; generated by the boot hook.
  watchdog_interval: 10
  # Independent battery/mount report. The URL is supplied from receiver Vault.
  health_interval: 300
  health_max_temp: 55
  log_max_bytes: 10485760
  # Kernel crash recovery, not a disk I/O timeout or worker restart policy.
  panic_delay: 5
  softlockup_panic: 1
  # The free-up flow no longer taps through the account menu (profile/free
  # coordinates removed 2026-10-13): the menu's geometry is state-dependent
  # and shifted ~260px between backup states, breaking fixed taps. The
  # script deep-links to the Free-up page instead; the only live tap
  # targets are the page's confirm button and the nav Home button.
  # confirm_* verified 2026-10-12 against Photos 7.96 and exercised
  # end-to-end 2026-10-13: the Free-up page has a single bottom button
  # "Free up N GB"; center (540, 1703). Page opens even with backup
  # incomplete.
  confirm_x: 540
  confirm_y: 1703
  home_x: 540
  home_y: 1850
  power_event: /dev/input/event4
  touch_event: /dev/input/event2
  # The captured cleanup script uses raw input events and fixed coordinates.
  # These are prerequisites for those taps, not proof that Photos' UI matches.
  screen_size: 1080x1920
  screen_density: 420
  power_device_name: gpio-keys
  touch_device_name: synaptics_dsxv26

# Expected effective UID for the management SSH login, separate from file ownership.
photo_management_identity:
  uid: 0

# Tailscale daemon settings for Pixel 1
pixel_tailscale_hostname: pixel1
pixel_tailscale_ssh_enabled: true
pixel_tailscale_tags:
  - tag:internal

