---
- name: Keep Photos prerequisite inspection read-only and unelevated
  ansible.builtin.assert:
    that:
      - photo_backup_operation | default('audit') == 'audit'
      - not (ansible_become | default(false) | bool)
    quiet: true

- name: Validate the configured drive and UI profile without needing health secrets
  ansible.builtin.import_tasks: validate_config.yml

- name: Read drive identity, Photos permissions and boot automation dependencies
  ansible.builtin.raw: "{{ lookup('ansible.builtin.template', 'audit/prerequisites.sh.j2') }}"
  register: pixel_runtime_prerequisites
  become: false
  check_mode: false
  changed_when: false

- name: Explain the requirements of the farm startup and cleanup scripts
  vars:
    runtime: '{{ pixel_runtime_prerequisites.stdout | from_yaml }}'
  block:
    - name: Require one connected ext4 filesystem with the configured UUID
      ansible.builtin.assert:
        that:
          - runtime.drive_matches == 1
          - runtime.drive_is_ext4
          - runtime.drive_is_block_device
        quiet: true
        fail_msg: >-
          The expected ext4 drive is absent, duplicated, or has a different
          filesystem. Check power, cabling and pixel_runtime_config.drive_uuid.
          Never format a disk or select an sdX name to make this check pass.

    - name: Require Android user storage and the Photos entry point
      ansible.builtin.assert:
        that:
          - runtime.primary_user_unlocked
          - runtime.photos_enabled
          - runtime.photos_home_activity
          - runtime.photos_can_read_storage
          - runtime.photos_can_write_storage
        quiet: true
        fail_msg: >-
          Complete primary-user setup, enable Google Photos and grant storage
          permissions through Android. The farm launches HomeActivity and needs
          shared-storage access. Google account and folder-backup settings still
          require manual inspection; package permissions do not prove those.

    - name: Require the screen and input devices expected by coordinate cleanup
      ansible.builtin.assert:
        that:
          - runtime.keyguard_has_no_credential
          - runtime.screen_size_matches
          - runtime.screen_density_matches
          - runtime.rotation_locked_portrait
          - runtime.power_input_present
          - runtime.touch_input_present
          - runtime.power_input_matches
          - runtime.touch_input_matches
        quiet: true
        fail_msg: >-
          The captured scripts cannot enter a PIN/password and assume the
          configured portrait display and raw input devices. Reconcile these
          prerequisites manually. Matching them does not verify Photos' current
          menu coordinates; the audit will never send taps to find out.

    - name: Require health reporting and watchdog kernel interfaces
      ansible.builtin.assert:
        that:
          - runtime.health_curl_available
          - runtime.battery_level_available
          - runtime.battery_temperature_available
          - runtime.kernel_panic_control_available
          - runtime.kernel_softlockup_control_available
        quiet: true
        fail_msg: >-
          The health loop uses /system/bin/curl and dumpsys battery; the boot
          script writes kernel panic controls. These interfaces must exist.
          Endpoint delivery and dashboard settings are separate manual checks.

    - name: Require each shell command used by startup, health and cleanup
      ansible.builtin.assert:
        that: item.value
        quiet: true
        fail_msg: 'Missing {{ item.key }}; a captured farm script depends on this command.'
      loop: "{{ runtime | dict2items | selectattr('key', 'match', '^command_') | list }}"
      loop_control:
        label: '{{ item.key }}'
