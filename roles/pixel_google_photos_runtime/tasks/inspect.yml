---
- name: Read hashes and metadata without staging remote modules
  ansible.builtin.raw: '{{ lookup(''ansible.builtin.template'', ''audit/source-probe.sh.j2'') }}'
  register: pixel_runtime_source_probe
  become: false
  changed_when: false
  check_mode: false
- name: Require exact source bytes and metadata without repair
  ansible.builtin.assert:
    that:
    - ('FILE|' ~ item.dest ~ '|' ~ item.sha256 ~ '|' ~ item.uid ~ '|' ~ item.gid ~ '|' ~ item.mode) in pixel_runtime_source_probe.stdout_lines
    quiet: true
    fail_msg: Source or metadata drift detected; no repair performed.
  loop: '{{ pixel_runtime_adoption_sources }}'
  loop_control:
    label: '{{ item.dest }}'
- name: Report the source adoption boundary
  ansible.builtin.debug:
    msg: 'SOURCE_MATCH_ONLY: pixel_google_photos_runtime sources match; this does not prove upload or cleanup success.'
