---
- name: Keep the package directory available with its declared permissions
  android_file:
    path: '/data/adb/service.d'
    allow_changes: '{{ pixel_runtime_maintenance_ready | default(false) | bool }}'
    state: directory
    owner: '0'
    group: '0'
    mode: '0755'
  check_mode: '{{ pixel_runtime_plan_only | default(ansible_check_mode) }}'
  register: pixel_runtime_directory_result

# Runtime ordering publishes the executable boot hook after its dependencies.
- name: Install the rendered sources with their declared permissions
  android_file:
    path: '{{ item.dest }}'
    allow_changes: '{{ pixel_runtime_maintenance_ready | default(false) | bool }}'
    content: "{{ lookup('ansible.builtin.template', item.template, rstrip=False) }}"
    owner: '{{ item.uid | string }}'
    group: '{{ item.gid | string }}'
    mode: '{{ item.mode }}'
  loop: >-
    {{ (pixel_runtime_adoption_sources | rejectattr('template', 'equalto', 'farm-startup.sh.j2') | list)
       + (pixel_runtime_adoption_sources | selectattr('template', 'equalto', 'farm-startup.sh.j2') | list) }}
  loop_control:
    label: '{{ item.dest }}'
  check_mode: '{{ pixel_runtime_plan_only | default(ansible_check_mode) }}'
  register: pixel_runtime_files_result
  no_log: true
  diff: false
