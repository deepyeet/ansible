---
- name: Keep the management connection free of global escalation
  ansible.builtin.assert:
    that:
    - not (ansible_become | default(false) | bool)
    quiet: true
- name: Validate the implementation inputs
  ansible.builtin.import_tasks: validate_config.yml
- name: Require an explicit health URL without printing or contacting it
  ansible.builtin.assert:
    that:
      - pixel_runtime_healthcheck_url is match('^https://[A-Za-z0-9./_-]+$')
    quiet: true
  no_log: true
  diff: false
- name: Require the complete declared file set
  ansible.builtin.assert:
    that:
    - pixel_runtime_files is sequence
    - pixel_runtime_files is not string
    - pixel_runtime_files | length == pixel_runtime_file_layout | length
    - pixel_runtime_files | map(attribute='template') | list | sort == pixel_runtime_file_layout.keys()
      | list | sort
    - pixel_runtime_files | map(attribute='dest') | unique | length == pixel_runtime_files
      | length
    quiet: true
    fail_msg: Missing, duplicate or incomplete managed file definitions.
- name: Validate each managed destination and its permissions
  ansible.builtin.assert:
    that:
    - item.dest == pixel_runtime_file_layout[item.template]
    - item.dest is match('^/[A-Za-z0-9_./-]+$')
    - "'..' not in item.dest.split('/')"
    - "'.' not in item.dest.split('/')"
    - "'//' not in item.dest"
    - item.uid is integer
    - item.gid is integer
    - item.uid >= 0
    - item.gid >= 0
    - item.mode is match('^[0-7]{3,4}$')
    - not item.mode.startswith('0')
    quiet: true
    fail_msg: Managed file definitions are outside the declared package or have invalid permissions.
  loop: '{{ pixel_runtime_files }}'
  loop_control:
    label: '{{ item.dest }}'
- name: Render every desired script before connecting
  vars:
    rendered_source: "{{ lookup('ansible.builtin.template', item.template, rstrip=False) }}"
  ansible.builtin.assert:
    that:
      - rendered_source | length > 0
    quiet: true
    fail_msg: A required script rendered empty.
  loop: '{{ pixel_runtime_files }}'
  loop_control:
    label: '{{ item.dest }}'
  no_log: true
  diff: false
