---
- name: Read mount and worker state without changing it
  ansible.builtin.raw: "{{ lookup('ansible.builtin.template', 'audit/runtime-probe.sh.j2') }}"
  register: pixel_activation_observation
  become: false
  check_mode: false
  changed_when: false

- name: Distinguish a stopped farm from a running one
  vars:
    farm: '{{ pixel_activation_observation.stdout | from_yaml }}'
  ansible.builtin.set_fact:
    pixel_runtime_cold: >-
      {{ farm.external_mount_count == 0 and farm.android_mount_count == 0
         and farm.watchdog_processes == 0 and farm.health_processes == 0
         and farm.startup_processes == 0 }}

- name: Refuse partial mounts, startup in progress or duplicate workers
  vars:
    farm: '{{ pixel_activation_observation.stdout | from_yaml }}'
  ansible.builtin.assert:
    that:
      - pixel_runtime_cold or (farm.external_mount_count == 1 and farm.android_mount_count == 2 and farm.watchdog_processes == 1 and farm.health_processes == 1 and farm.startup_processes == 0)
    quiet: true
    fail_msg: >-
      The farm is partially started or duplicated. Inspect the boot log and
      mounts; activation will not rerun the legacy hook, kill workers or unmount storage.
