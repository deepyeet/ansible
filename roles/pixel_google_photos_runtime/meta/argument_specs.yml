---
argument_specs:
  main:
    short_description: Manage the declared source files without restarting the farm
    options: &file_options
      pixel_runtime_files:
        type: list
        elements: dict
        required: true
        options:
          template:
            type: str
            required: true
          dest:
            type: str
            required: true
          uid:
            type: int
            required: true
          gid:
            type: int
            required: true
          mode:
            type: str
            required: true
      pixel_runtime_config: &runtime_config
        type: dict
        required: true
        options:
          scripts_dir:
            type: str
            required: true
          drive_mount:
            type: str
            required: true
          log_path:
            type: str
            required: true
          drive_uuid:
            type: str
            required: true
          power_event:
            type: str
            required: true
          touch_event:
            type: str
            required: true
          screen_size:
            type: str
            required: true
          screen_density:
            type: int
            required: true
          power_device_name:
            type: str
            required: true
          touch_device_name:
            type: str
            required: true
          lookup_retries:
            type: int
            required: true
          lookup_sleep:
            type: int
            required: true
          watchdog_interval:
            type: int
            required: true
          health_interval:
            type: int
            required: true
          health_max_temp:
            type: int
            required: true
          log_max_bytes:
            type: int
            required: true
          panic_delay:
            type: int
            required: true
          softlockup_panic:
            type: int
            required: true
          profile_x:
            type: int
            required: true
          profile_y:
            type: int
            required: true
          free_x:
            type: int
            required: true
          free_y:
            type: int
            required: true
          confirm_x:
            type: int
            required: true
          confirm_y:
            type: int
            required: true
          home_x:
            type: int
            required: true
          home_y:
            type: int
            required: true
          back_x:
            type: int
            required: true
          back_y:
            type: int
            required: true
      pixel_runtime_healthcheck_url:
        type: str
        required: true
        no_log: true
  validate:
    short_description: Validate source inputs and rendering on the controller only
    options: *file_options
  prerequisites:
    short_description: Inspect drive identity and Photos setup without installed farm scripts
    options:
      pixel_runtime_config: *runtime_config
  status:
    short_description: Inspect platform prerequisites, mounted storage and farm workers
    options:
      pixel_runtime_config: *runtime_config
  plan:
    short_description: Inspect prerequisites and predict source changes without writing
    options: *file_options
  activation_state:
    short_description: Classify the farm as stopped, running or unsafe to start
    options: *file_options
  activate:
    short_description: Explicitly start a cold farm during a controller maintenance window
    options: *file_options
  apply:
    short_description: Apply a preceding source plan without repeating platform inspection
    options: *file_options
  start:
    short_description: Start a previously planned installation with a fresh runtime state check
    options: *file_options
