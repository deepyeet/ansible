---
argument_specs:
  main:
    short_description: Manage the declared source files without restarting the farm
    options: &file_options
      photo_ingest_file_owner:
        type: str
        required: true
      photo_ingest_file_group:
        type: str
        required: true
      photo_ingest_files:
        type: list
        elements: dict
        required: true
        options:
          template:
            type: str
            required: true
          dest:
            type: str
            required: true
          mode:
            type: str
            required: true
      photo_ingest:
        type: dict
        required: true
        options:
          base_dir:
            type: str
            required: true
          state_dir:
            type: str
            required: true
          ssh_key_path:
            type: str
            required: true
          ingest_age:
            type: int
            required: true
          ingest_min_date:
            type: str
            required: true
          rsync_timeout:
            type: int
            required: true
          cleanup_interval:
            type: int
            required: true
      photo_ingest_healthcheck_url:
        type: str
        required: true
        no_log: true
      photo_ingest_endpoint:
        type: dict
        required: true
        options:
          protocol:
            type: str
            required: true
          address:
            type: str
            required: true
          root:
            type: str
            required: true
          ssh_user:
            type: str
            required: true
          ssh_port:
            type: int
            required: true
          completion:
            type: str
            required: true
          cleanup_argv:
            type: list
            required: true
            elements: str
  validate:
    short_description: Validate source inputs and rendering on the controller only
    options: *file_options
  plan:
    short_description: Inspect prerequisites and predict source changes without writing
    options: *file_options
  apply:
    short_description: Apply a preceding source plan without repeating platform inspection
    options: *file_options
