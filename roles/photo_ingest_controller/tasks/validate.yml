---
- name: Keep the management connection free of global escalation
  ansible.builtin.assert:
    that:
    - not (ansible_become | default(false) | bool)
    quiet: true
# This bounded protocol is independent of the phone/provider implementation.
# Its behavioral assumptions (same-filesystem promotion, excluded staging and
# cleanup only after backup) require separate evidence; booleans cannot prove them.
- name: Require the receiver contract implemented by the legacy queue algorithm
  ansible.builtin.assert:
    that:
      - photo_ingest_endpoint.protocol == 'rsync_drop_v1'
      - photo_ingest_endpoint.completion == 'local_absence_after_cleanup'
      - photo_ingest_endpoint.root is match('^/[A-Za-z0-9_/-]+$')
      - "'..' not in photo_ingest_endpoint.root.split('/')"
      - "'//' not in photo_ingest_endpoint.root"
      - not photo_ingest_endpoint.root.endswith('/')
      - photo_ingest_endpoint.address is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
      - photo_ingest_endpoint.ssh_user is match('^[a-z_][a-z0-9_-]*$')
      - photo_ingest_endpoint.ssh_port is integer
      - photo_ingest_endpoint.ssh_port >= 1
      - photo_ingest_endpoint.ssh_port <= 65535
      - photo_ingest_endpoint.cleanup_argv is sequence
      - photo_ingest_endpoint.cleanup_argv is not string
      - photo_ingest_endpoint.cleanup_argv | length > 0
    quiet: true
    fail_msg: The endpoint declaration must use the supported rsync_drop_v1 configuration.

- name: Constrain cleanup arguments to tokens the preserved shell can encode
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9_./-]+$')
    quiet: true
  loop: '{{ photo_ingest_endpoint.cleanup_argv }}'

- name: Constrain local paths used by the preserved shell program
  ansible.builtin.assert:
    that:
      - item is match('^/[A-Za-z0-9_/-]+$')
      - "'..' not in item.split('/')"
      - "'.' not in item.split('/')"
      - "'//' not in item"
      - not item.endswith('/')
    quiet: true
  loop:
    - '{{ photo_ingest.base_dir }}'
    - '{{ photo_ingest.state_dir }}'
    - '{{ photo_ingest.ssh_key_path }}'

- name: Validate queue timing inputs
  ansible.builtin.assert:
    that:
      - photo_ingest.ingest_age | int >= 0
      - photo_ingest.ingest_min_date is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
      - photo_ingest.rsync_timeout | int > 0
      - photo_ingest.cleanup_interval | int > 0
    quiet: true

- name: Require an explicit health URL without printing or contacting it
  ansible.builtin.assert:
    that:
      - photo_ingest_healthcheck_url is match('^https://[A-Za-z0-9./_-]+$')
    quiet: true
  no_log: true
  diff: false

- name: Require explicit local ownership names for the manager
  ansible.builtin.assert:
    that:
      - photo_ingest_file_owner is match('^[a-z_][a-z0-9_-]*$')
      - photo_ingest_file_group is match('^[a-z_][a-z0-9_-]*$')
    quiet: true

- name: Require the complete declared file set
  ansible.builtin.assert:
    that:
    - photo_ingest_files is sequence
    - photo_ingest_files is not string
    - photo_ingest_files | length == photo_ingest_file_layout | length
    - photo_ingest_files | map(attribute='template') | list | sort == photo_ingest_file_layout.keys()
      | list | sort
    - photo_ingest_files | map(attribute='dest') | unique | length == photo_ingest_files |
      length
    quiet: true
    fail_msg: Missing, duplicate or incomplete managed file definitions.
- name: Validate each managed destination and its permissions
  ansible.builtin.assert:
    that:
    - item.dest == photo_ingest_file_layout[item.template]
    - item.dest is match('^/[A-Za-z0-9_./-]+$')
    - "'..' not in item.dest.split('/')"
    - "'.' not in item.dest.split('/')"
    - "'//' not in item.dest"
    - item.mode is match('^[0-7]{3,4}$')
    - not item.mode.startswith('0')
    quiet: true
    fail_msg: Managed file definitions are outside the declared package or have invalid permissions.
  loop: '{{ photo_ingest_files }}'
  loop_control:
    label: '{{ item.dest }}'
- name: Render every desired script before connecting
  vars:
    rendered_source: "{{ lookup('ansible.builtin.template', item.template, rstrip=False) }}"
  ansible.builtin.assert:
    that:
      - rendered_source | length > 0
    quiet: true
    fail_msg: A required script rendered empty.
  loop: '{{ photo_ingest_files }}'
  loop_control:
    label: '{{ item.dest }}'
  no_log: true
  diff: false
