---
- name: "Ensure target directory exists for transmission stack"
  ansible.builtin.file:
    path: "/home/{{ansible_user}}/ansible_docker/transmission"
    state: directory
    owner: "{{ansible_user}}"
    group: "{{ansible_user}}"
    mode: '0755'

- name: Ensure Gluetun auth directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/ansible_docker/transmission/gluetun/auth"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: Ensure monitor recovery state directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/ansible_docker/transmission/recovery-state"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: "Copy static docker files"
  ansible.builtin.copy:
    src: "files/{{ item }}/"
    dest: "/home/{{ ansible_user }}/ansible_docker/transmission/{{ item }}/"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
    remote_src: false
  loop:
    - backup
    - gluetun
    - mam-updater
    - ptp-archiver
    - transmission-healthcheck
  register: docker_files_copy

- name: "Set fact if static docker files changed"
  ansible.builtin.set_fact:
    static_docker_files_changed: "{{ docker_files_copy.results | selectattr('changed', 'equalto', true) | length > 0 }}"

- name: Template Gluetun control authentication
  ansible.builtin.template:
    src: gluetun-auth.toml.j2
    dest: "/home/{{ ansible_user }}/ansible_docker/transmission/gluetun/auth/config.toml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
  register: gluetun_auth_template
  no_log: true
  diff: false

- name: "Template compose.yaml from j2"
  ansible.builtin.template:
    src: "compose.yaml.j2"
    dest: "/home/{{ansible_user}}/ansible_docker/transmission/compose.yaml"
    owner: "{{ansible_user}}"
    group: "{{ansible_user}}"
    mode: '0644'
  register: docker_compose_template

- name: "Create .env file from template"
  ansible.builtin.template:
    src: "env.j2"
    dest: "/home/{{ansible_user}}/ansible_docker/transmission/.env"
    owner: "{{ansible_user}}"
    group: "{{ansible_user}}"
    mode: '0600' # Secrets file should not be world-readable
  no_log: true
  register: docker_env_template

- name: Validate and apply Docker stack outside Ansible check mode
  ansible.builtin.include_tasks: docker_runtime.yml
  when: not ansible_check_mode
