---
- name: Ensure local recovery executable directory exists
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install torrent stack recovery script
  ansible.builtin.copy:
    src: recovery/recover.py
    dest: /usr/local/libexec/torrenter-recovery
    owner: root
    group: root
    mode: '0755'

- name: Install torrent stack recovery service
  ansible.builtin.template:
    src: torrenter-recovery.service.j2
    dest: /etc/systemd/system/torrenter-recovery.service
    owner: root
    group: root
    mode: '0644'

- name: Install torrent stack recovery timer
  ansible.builtin.template:
    src: torrenter-recovery.timer.j2
    dest: /etc/systemd/system/torrenter-recovery.timer
    owner: root
    group: root
    mode: '0644'

- name: Reload systemd for torrent recovery units
  ansible.builtin.systemd_service:
    daemon_reload: true
