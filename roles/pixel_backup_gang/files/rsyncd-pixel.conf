# B31: rsync daemon config for pixel_manager's file channel.
# Served ONLY as the forced command of the pinned key in
# /data/ssh/root/.ssh/authorized_keys (see authorized_keys.pixel_rsync).
# The daemon never listens on a network port in this role; it speaks
# over the ssh stdio channel (`rsync --server --daemon`).
log file = /data/ssh/rsyncd-pixel.log
lock file = /data/ssh/rsyncd-pixel.lock
[pixel]
    path = /sdcard/the_binding
    comment = pixel_manager file channel (B31)
    use chroot = yes
    uid = 2000
    gid = 9997
    read only = no
    max connections = 4
    timeout = 120
