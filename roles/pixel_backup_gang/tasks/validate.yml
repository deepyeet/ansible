---
- name: Keep the management connection free of global escalation
  ansible.builtin.assert:
    that:
    - not (ansible_become | default(false) | bool)
    quiet: true
- name: Constrain paths to the supported rooted Android storage profile
  ansible.builtin.assert:
    that:
      - pbg_config.helpers_dir is match('^/data/local/tmp/[A-Za-z0-9_-]+$')
      - pbg_config.drive_mount is match('^/mnt/[A-Za-z0-9_-]+$')
      - pbg_config.bind_path == '/mnt/runtime/write/emulated/0/the_binding'
    quiet: true

- name: Require the complete declared file set
  ansible.builtin.assert:
    that:
    - pbg_files is sequence
    - pbg_files is not string
    - pbg_files | length == pbg_file_layout | length
    - pbg_files | map(attribute='template') | list | sort == pbg_file_layout.keys() | list | sort
    - pbg_files | map(attribute='dest') | unique | length == pbg_files | length
    quiet: true
    fail_msg: Missing, duplicate or incomplete managed file definitions.
- name: Validate each managed destination and its permissions
  ansible.builtin.assert:
    that:
    - item.dest == pbg_file_layout[item.template]
    - item.dest is match('^/[A-Za-z0-9_./-]+$')
    - "'..' not in item.dest.split('/')"
    - "'.' not in item.dest.split('/')"
    - "'//' not in item.dest"
    - item.uid is integer
    - item.gid is integer
    - item.uid >= 0
    - item.gid >= 0
    - item.mode is match('^[0-7]{3,4}$')
    - not item.mode.startswith('0')
    quiet: true
    fail_msg: Managed file definitions are outside the declared package or have invalid permissions.
  loop: '{{ pbg_files }}'
  loop_control:
    label: '{{ item.dest }}'
- name: Render every desired script before connecting
  vars:
    rendered_source: "{{ lookup('ansible.builtin.template', item.template, rstrip=False) }}"
  ansible.builtin.assert:
    that:
      - rendered_source | length > 0
    quiet: true
    fail_msg: A required script rendered empty.
  loop: '{{ pbg_files }}'
  loop_control:
    label: '{{ item.dest }}'
  no_log: true
  diff: false
