---
# Explicit read-only baseline inspection.
- name: Require audit operation for baseline assertions
  ansible.builtin.assert:
    that: photo_backup_operation == 'audit'
    quiet: true
- name: Validate explicit inputs and exact rendering before connecting
  ansible.builtin.import_tasks: validate.yml
- name: Require the underlying Android storage and Magisk setup
  ansible.builtin.import_tasks: prerequisites.yml
- name: Read source fingerprints and fail on drift
  ansible.builtin.import_tasks: inspect.yml
