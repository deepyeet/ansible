---
argument_specs:
  main:
    short_description: Manage the declared source files without restarting the farm
    options: &adoption_options
      pbg_adoption_sources:
        type: list
        elements: dict
        required: true
        options:
          source:
            type: str
          template:
            type: str
            required: true
          dest:
            type: str
            required: true
          sha256:
            type: str
            required: true
          uid:
            type: int
            required: true
          gid:
            type: int
            required: true
          mode:
            type: str
            required: true
      pbg_config:
        type: dict
        required: true
        options:
          helpers_dir:
            type: str
            required: true
          drive_mount:
            type: str
            required: true
          bind_path:
            type: str
            required: true
  validate:
    short_description: Validate source inputs and rendering on the controller only
    options: *adoption_options
  prerequisites:
    short_description: Inspect Android and Magisk before any helper files are installed
    options: {}
  plan:
    short_description: Inspect prerequisites and predict source changes without writing
    options: *adoption_options
  audit:
    short_description: Require the captured baseline and inspect installed state
    options: *adoption_options
  apply:
    short_description: Apply a preceding source plan without repeating platform inspection
    options: *adoption_options
