---
# defaults/main.yml for pixel_tailscale

pixel_tailscale_version: "1.104.1"
pixel_tailscale_tarball_checksum: "f60294374967f3dfd8cf57bbbd474d6cfce32d123e3a8ddeab82a87940daa806"
pixel_tailscale_daemon_checksum: "6367abc3ffd608ed64a762928444ee53ac4e99bf19baabb0321852d7f02b10b6"
pixel_tailscale_cli_checksum: "6c2c134abad7cbbc8bc94a226b2972b4b7d5603daa0ca0bb9dc3b74a1dc15814"

pixel_tailscale_base_dir: "/data/adb/tailscale"
pixel_tailscale_bin_dir: "{{ pixel_tailscale_base_dir }}/bin"
pixel_tailscale_state_dir: "{{ pixel_tailscale_base_dir }}/state"
pixel_tailscale_run_dir: "{{ pixel_tailscale_base_dir }}/run"
pixel_tailscale_log_path: "{{ pixel_tailscale_base_dir }}/run/tailscaled.log"
pixel_tailscale_log_max_bytes: 5242880 # 5 MB max
pixel_tailscale_socket: "{{ pixel_tailscale_base_dir }}/run/tailscaled.sock"
pixel_tailscale_pid_file: "{{ pixel_tailscale_base_dir }}/run/tailscaled.pid"
pixel_tailscale_supervisor_pid_file: "{{ pixel_tailscale_base_dir }}/run/supervisor.pid"
pixel_tailscale_port: 41641

# Networking & Service options
pixel_tailscale_tun_mode: "userspace-networking" # or "tun"
pixel_tailscale_ssh_enabled: true
pixel_tailscale_hostname: "pixel1"
pixel_tailscale_tags:
  - "tag:internal"
pixel_tailscale_accept_dns: false
pixel_tailscale_accept_routes: false

# Auth key (optional; if unset, operator logs in interactively)
pixel_tailscale_authkey: "{{ vault_pixel_tailscale_authkey | default('') }}"
