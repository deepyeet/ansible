# Controller-only role entry points; keep input bindings aligned with the live composition.
---
- name: Validate the captured upstream storage helpers
  ansible.builtin.include_role:
    name: pixel_backup_gang
    tasks_from: validate
    public: false
  vars:
    pbg_adoption_sources: '{{ photo_adoption_sources.pixel_backup_gang }}'

- name: Validate the custom boot, health and Photos cleanup runtime
  ansible.builtin.include_role:
    name: pixel_google_photos_runtime
    tasks_from: validate
    public: false
  vars:
    pixel_runtime_adoption_sources: '{{ photo_adoption_sources.pixel_google_photos_runtime }}'
    pixel_runtime_healthcheck_url: '{{ vault_pixel_backup_healthcheck_url }}'
