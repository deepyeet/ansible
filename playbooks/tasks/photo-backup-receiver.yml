---
- name: Manage the captured upstream storage helpers
  ansible.builtin.include_role:
    name: pixel_backup_gang
    tasks_from: apply
    public: false
  vars:
    pbg_maintenance_ready: '{{ photo_maintenance_ready | default(false) }}'
    pbg_files: '{{ photo_managed_files.pixel_backup_gang }}'

- name: Manage the custom boot, health and Photos cleanup runtime
  ansible.builtin.include_role:
    name: pixel_google_photos_runtime
    tasks_from: apply
    public: false
  vars:
    pixel_runtime_maintenance_ready: '{{ photo_maintenance_ready | default(false) }}'
    pixel_runtime_files: '{{ photo_managed_files.pixel_google_photos_runtime }}'
    pixel_runtime_healthcheck_url: '{{ vault_pixel_backup_healthcheck_url }}'
