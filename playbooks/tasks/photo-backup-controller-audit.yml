---
- name: Validate the operator-managed scheduler profile
  ansible.builtin.import_tasks: photo-backup-scheduler.yml

- name: Pass the declared peer endpoint to the ingest controller
  ansible.builtin.include_role:
    name: photo_ingest_controller
    tasks_from: audit
    public: false
  vars:
    # Topology preflight requires exactly one matching edge for each controller.
    photo_pipeline: "{{ photo_pipelines.values() | selectattr('controller', 'equalto', inventory_hostname) | first }}"
    photo_peer: '{{ hostvars[photo_pipeline.receiver] }}'
    photo_ingest_endpoint: >-
      {{ photo_peer.photo_receiver | combine({
        'address': photo_peer.photo_receiver.data_address | default(photo_peer.ansible_host)}) }}
    photo_ingest_file_owner: '{{ synology_photo_backup.owner }}'
    photo_ingest_file_group: '{{ synology_photo_backup.group }}'
    photo_ingest_adoption_sources: '{{ photo_adoption_sources.photo_ingest_controller }}'
    photo_ingest_healthcheck_url: '{{ vault_synology_pixel_healthcheck_url }}'
